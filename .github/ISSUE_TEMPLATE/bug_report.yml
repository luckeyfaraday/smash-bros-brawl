name: Bug report
description: Report a reproducible problem in the game or development tools.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check the setup guide before reporting missing assets. Do not attach game
        images, exported game files, credentials or private information.
        For vulnerabilities, follow SECURITY.md instead.
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: What did you expect, and what happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the page, fighters, mode and controls used.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, OS, browser/version, Node version, and whether local assets were prepared.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Relevant console errors, screenshots or a minimal replay. Remove personal information.
